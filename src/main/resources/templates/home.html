<div xmlns:th="http://www.thymeleaf.org"
     th:fragment="content"
     class="container py-4">

    <div class="text-center mb-4">
        <img th:src="@{/images/logo.png}"
             alt="Logo ThinDesk"
             width="140">

        <h2 class="mt-3">Dashboard ThinDesk</h2>

        <p class="text-muted">
            Visão geral dos chamados técnicos
        </p>
    </div>

    <div class="row g-3">

        <div class="col-md-4">
            <div class="card shadow-sm h-100">
                <div class="card-body text-center">
                    <h5>Total de Chamados</h5>
                    <h2 th:text="${totalChamados}">0</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm h-100">
                <div class="card-body text-center">
                    <h5>Chamados Abertos</h5>
                    <h2 th:text="${abertos}">0</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm h-100">
                <div class="card-body text-center">
                    <h5>Em Andamento</h5>
                    <h2 th:text="${emAndamento}">0</h2>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-body text-center">
                    <h5>Chamados Concluídos</h5>
                    <h2 th:text="${concluidos}">0</h2>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-body text-center">
                    <h5>Chamados Cancelados</h5>
                    <h2 th:text="${cancelados}">0</h2>
                </div>
            </div>
        </div>

    </div>

    <div class="text-center mt-4">
        <a th:href="@{/chamados}"
           class="btn btn-primary">
            Gerenciar Chamados
        </a>
    </div>

</div>
