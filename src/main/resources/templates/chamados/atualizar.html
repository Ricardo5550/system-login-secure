<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Chamado - ThinDesk</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<aside>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
</aside>

<div class="container mt-4">

    <h2 class="mb-4">Editar Chamado</h2>

    <div class="card shadow-sm">
        <div class="card-body p-4">

            <form th:action="@{/chamados/atualizar/{id}(id=${chamado.id})}"
                  th:object="${chamado}"
                  method="post">

                <div class="row g-3">

                    <div class="col-12">
                        <label for="descricao" class="form-label">
                            Descrição
                        </label>

                        <input type="text"
                               id="descricao"
                               th:field="*{descricao}"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label for="status" class="form-label">
                            Status
                        </label>

                        <select id="status"
                                th:field="*{status}"
                                class="form-select"
                                required>

                            <option value="ABERTO">Aberto</option>
                            <option value="EM_ANDAMENTO">Em andamento</option>
                            <option value="CONCLUIDO">Concluído</option>
                            <option value="CANCELADO">Cancelado</option>

                        </select>
                    </div>

                    <div class="col-md-6">
                        <label for="tipo" class="form-label">
                            Tipo
                        </label>

                        <input type="text"
                               id="tipo"
                               th:field="*{tipo}"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label for="tecnico" class="form-label">
                            Técnico
                        </label>

                        <input type="text"
                               id="tecnico"
                               th:field="*{tecnico}"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label for="usuario" class="form-label">
                            Usuário
                        </label>

                        <input type="text"
                               id="usuario"
                               th:field="*{usuario}"
                               class="form-control"
                               required>
                    </div>

                </div>

                <div class="mt-4 d-flex gap-2">

                    <button type="submit"
                            class="btn btn-success">
                        Salvar Alterações
                    </button>

                    <a th:href="@{/chamados}"
                       class="btn btn-secondary">
                        Voltar
                    </a>

                </div>

            </form>

        </div>
    </div>

</div>

<script th:src="@{/js/script.js}"></script>

</body>
</html>
