<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Novo Chamado - ThinDesk</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<aside>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
</aside>

<div class="container mt-4">
    <h2 class="mb-4">Novo Chamado</h2>

    <form th:action="@{/chamados/novo}"
          th:object="${chamado}"
          method="post">

        <div class="mb-3">
            <label for="descricao" class="form-label">
                Descrição:
            </label>
            <input type="text"
                   id="descricao"
                   th:field="*{descricao}"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label for="status" class="form-label">
                Status:
            </label>
            <select id="status"
                    th:field="*{status}"
                    class="form-select"
                    required>
                <option value="">Selecione o status</option>
                <option value="ABERTO">Aberto</option>
                <option value="EM_ANDAMENTO">Em Andamento</option>
                <option value="CONCLUIDO">Concluído</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="tipo" class="form-label">
                Tipo:
            </label>
            <input type="text"
                   id="tipo"
                   th:field="*{tipo}"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label for="tecnico" class="form-label">
                Técnico:
            </label>
            <input type="text"
                   id="tecnico"
                   th:field="*{tecnico}"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label for="usuario" class="form-label">
                Usuário:
            </label>
            <input type="text"
                   id="usuario"
                   th:field="*{usuario}"
                   class="form-control"
                   required>
        </div>

        <button type="submit" class="btn btn-success">
            Salvar Chamado
        </button>

        <a th:href="@{/chamados}" class="btn btn-secondary">
            Voltar
        </a>

    </form>
</div>

<script th:src="@{/js/script.js}"></script>

</body>
</html>
